```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Login | LuponResolve</title>

    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <main class="auth-container">

        <section class="auth-brand">
            <div class="brand-logo">LR</div>

            <h1>LuponResolve</h1>

            <p>
                A digital platform for barangay dispute
                resolution and case management.
            </p>

            <div class="brand-footer">
                Barangay Justice System
            </div>
        </section>

        <section class="auth-panel">

            <div class="auth-heading">
                <h2 id="formTitle">Staff Sign In</h2>

            <p id="formDescription">
                Authorized Barangay Secretary and Lupon personnel only.
            </p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="loginEmail">Email address</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your staff email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" id="loginButton">
                    Sign In
                </button>

            </form>

            <div id="authMessage"
                 class="auth-message hidden"
                 role="status"
                 aria-live="polite">
            </div>

            <p class="form-switch">
                Need to file a complaint?
                <a href="guest-complaint.html">Submit without an account</a>
            </p>

            <p class="form-switch">
                <a href="index.html">← Back to homepage</a>
            </p>

        </section>

    </main>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
```
